name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamdeck-plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: streamdeck-plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack plugin
        run: npx --yes @elgato/cli@latest pack com.sheepy.display-knob.sdPlugin --output . --force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: display-knob-plugin
          path: streamdeck-plugin/com.sheepy.display-knob.streamDeckPlugin

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: streamdeck-plugin/com.sheepy.display-knob.streamDeckPlugin
          generate_release_notes: true
