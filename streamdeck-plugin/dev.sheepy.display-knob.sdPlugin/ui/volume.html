<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="sdpi-components.js"></script>
</head>
<body>
  <sdpi-item label="Direction">
    <sdpi-select setting="direction" default="up">
      <option value="up">Up</option>
      <option value="down">Down</option>
    </sdpi-select>
  </sdpi-item>
  <sdpi-item label="Step">
    <sdpi-range setting="step" min="1" max="25" step="1" default="5" showlabels></sdpi-range>
  </sdpi-item>
</body>
</html>
